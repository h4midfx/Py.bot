# Render Blueprint — ربات تلگرام (Background Worker + دیسک دائمی برای SQLite)
# نکته: Background Worker پلن رایگان ندارد (کمترین پلن: starter). دیسک فقط روی سرویس‌های پولی ممکن است.
# ریجن آمریکایی (oregon/ohio/virginia) را انتخاب نکنید: بایننس فیوچرز IP آمریکا را معمولاً مسدود می‌کند.
services:
  - type: worker
    name: signal-bot
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python signal_bot.py
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DB_PATH
        value: /var/data/bot.db
      # رازها: Render موقع ساخت از شما می‌پرسد و در مخزن ذخیره نمی‌شوند
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      # برای تست اولیه؛ بعد از تست پرداخت ۱ ستاره‌ای، قیمت واقعی بگذارید
      - key: PLANS
        value: test:1:1
      - key: EXCHANGE
        value: binance
      - key: TIMEFRAME
        value: 15m
      - key: MIN_SCORE
        value: "2"
